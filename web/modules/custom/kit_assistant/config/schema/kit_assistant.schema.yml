kit_assistant.settings:
  type: config_object
  label: 'Kit Assistant settings'
  mapping:
    enabled:
      type: boolean
      label: 'Chat widget enabled'
    model:
      type: string
      label: 'OpenAI chat model'
    moderation_model:
      type: string
      label: 'OpenAI moderation model'
    max_tool_rounds:
      type: integer
      label: 'Maximum tool-call rounds per message'
    history_turns:
      type: integer
      label: 'Conversation turns kept per visitor'
